
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Booking | WedPlan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/booking.css}">
</head>

<body class="wp-add-body">

<header class="wp-header">
    <div class="wp-header-inner">
        <a th:href="@{/bookings}" class="wp-brand">
            <span class="wp-brand-mark">W</span>
            <span>
                <span class="wp-brand-name">WedPlan</span>
                <span class="wp-header-label">WEDDING MANAGEMENT</span>
            </span>
        </a>

        <a th:href="@{/bookings}" class="wp-back-btn">
            &larr; All Bookings
        </a>
    </div>
</header>

<main class="wp-add-page">

    <div class="wp-add-heading">
        <p class="wp-eyebrow">WEDPLAN · BOOKING MANAGEMENT</p>
        <h1>Edit Booking</h1>
        <p>Update the details for booking #<span th:text="${b.id}"></span>.</p>
    </div>

    <section class="wp-add-card">

        <div class="wp-add-card-heading">
            <span class="wp-add-icon">&#10022;</span>
            <div>
                <h2>Booking Information</h2>
                <p>Make the necessary changes below.</p>
            </div>
        </div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}"></div>

        <form th:action="@{/bookings/{id}/update(id=${b.id})}"
              method="post"
              onsubmit="return validateBooking()">

            <div class="wp-add-form-grid">

                <div class="wp-add-field">
                    <label for="type">Booking Type</label>
                    <input type="text" id="type"
                           class="form-control"
                           th:value="${b.type}" disabled>
                    <input type="hidden" name="type"
                           th:value="${b.type}">
                </div>

                <div class="wp-add-field">
                    <label for="status">Booking Status</label>
                    <select id="status" name="status"
                            class="form-select" required>
                        <option value="PENDING"
                                th:selected="${b.status == 'PENDING'}">
                            Pending
                        </option>
                        <option value="CONFIRMED"
                                th:selected="${b.status == 'CONFIRMED'}">
                            Confirmed
                        </option>
                        <option value="CANCELLED"
                                th:selected="${b.status == 'CANCELLED'}">
                            Cancelled
                        </option>
                    </select>
                </div>

                <div class="wp-add-field">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName"
                           name="customerName" class="form-control"
                           th:value="${b.customerName}" required>
                </div>

                <div class="wp-add-field">
                    <label for="vendorName">Vendor Name</label>
                    <input type="text" id="vendorName"
                           name="vendorName" class="form-control"
                           th:value="${b.vendorName}" required>
                </div>

                <div class="wp-add-field">
                    <label for="eventDate">Event Date</label>
                    <input type="date" id="eventDate"
                           name="eventDate" class="form-control"
                           th:value="${b.eventDate}" required>
                </div>

                <div class="wp-add-field">
                    <label for="qty"
                           th:text="${b.type == 'CATERING'} ?
                           'Number of Guests' : 'Hours'">
                    </label>
                    <input type="number" id="qty" name="qty"
                           step="0.5" min="0.5"
                           class="form-control"
                           th:value="${b.quantity}" required>
                </div>

                <div class="wp-add-field">
                    <label for="rate"
                           th:text="${b.type == 'CATERING'} ?
                           'Price per Plate (LKR)' : 'Hourly Rate (LKR)'">
                    </label>
                    <input type="number" id="rate" name="rate"
                           step="0.01" min="0.01"
                           class="form-control"
                           th:value="${b.rate}" required>
                </div>

                <div th:if="${b.type == 'PHOTOGRAPHY'}"
                     class="wp-add-field wp-add-extra">
                    <label for="extra">Album Fee (LKR)</label>
                    <input type="number" id="extra" name="extra"
                           step="0.01" min="0"
                           class="form-control"
                           th:value="${b.extra}">
                </div>

            </div>

            <div class="wp-add-note">
                <span>&#10022;</span>
                Review your changes before updating this booking.
            </div>

            <div class="wp-add-actions">
                <button type="submit" class="wp-add-save-btn">
                    Update Booking
                </button>

                <a th:href="@{/bookings}"
                   class="wp-add-cancel-btn">
                    Cancel
                </a>
            </div>

        </form>
    </section>

    <p class="wp-add-footer">
        Made with care for your special day.
    </p>

</main>

<script>
    function validateBooking() {

        const qty = parseFloat(document.getElementById('qty').value);
        const rate = parseFloat(document.getElementById('rate').value);

        const type = document.querySelector('input[name="type"]').value;

        if (!Number.isFinite(qty) || qty <= 0) {
            alert("Quantity must be greater than 0.");
            return false;
        }

        if (!Number.isFinite(rate) || rate <= 0) {
            alert("Rate must be greater than 0.");
            return false;
        }

        if (type === 'PHOTOGRAPHY') {

            const extra = parseFloat(document.getElementById('extra').value);

            if (!Number.isFinite(extra) || extra < 0) {
                alert("Album Fee cannot be negative.");
                return false;
            }
        }

        return true;
    }
</script>

</body>
</html>
