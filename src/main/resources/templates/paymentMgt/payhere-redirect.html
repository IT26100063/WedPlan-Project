<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to PayHere | WedPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style/payment-management.css}">
</head>
<body>
<main class="container py-5 customer-flow-page">
  <section class="panel customer-flow-card text-center">
    <p class="eyebrow mb-2">PAYHERE SANDBOX</p>
    <h1 class="h3">Continue to the secure payment page</h1>
    <p class="text-secondary">WedPlan never receives your card number or security code.</p>
    <form id="payhereForm" th:action="${checkout.checkoutUrl}" method="post" class="mt-4">
      <div th:each="field : ${checkout.fields}">
        <input type="hidden" th:name="${field.key}" th:value="${field.value}">
      </div>
      <button class="btn btn-primary wp-primary" type="submit">Continue to PayHere</button>
    </form>
    <script>document.getElementById('payhereForm').submit();</script>
  </section>
</main>
</body>
</html>
