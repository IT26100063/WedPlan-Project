<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in | WedPlan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style/payment-management.css}">
</head>
<body class="login-page">
<main class="login-card">
  <a class="navbar-brand wp-brand" th:href="@{/}">WedPlan<span>.</span></a>
  <p class="eyebrow mt-4 mb-2">ADMINISTRATION</p>
  <h1 class="h3 mb-2">Welcome back</h1>
  <p class="text-secondary mb-4">Sign in to manage reservations and payment records.</p>
  <div class="alert alert-danger" role="alert" th:if="${param.error}">Sign-in failed. Check your admin username and password.</div>
  <div class="alert alert-info" role="status" th:unless="${adminConfigured}">Admin sign-in is disabled until WEDPLAN_ADMIN_USERNAME and WEDPLAN_ADMIN_PASSWORD are configured.</div>
  <form th:action="@{/admin/login}" method="post">
    <label class="form-label" for="username">Admin username</label>
    <input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary wp-primary w-100" type="submit">Sign in securely</button>
  </form>
  <a class="link-secondary d-inline-block mt-4" th:href="@{/}">Back to WedPlan</a>
</main>
</body>
</html>
