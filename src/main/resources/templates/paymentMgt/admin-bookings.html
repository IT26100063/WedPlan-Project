<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookings | WedPlan Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style/payment-management.css}">
</head>
<body>
<nav class="navbar wp-navbar"><div class="container"><a class="navbar-brand wp-brand" th:href="@{/admin/bookings}">WedPlan<span>.</span></a><div class="d-flex align-items-center gap-2"><a class="btn btn-light" th:href="@{/payments}">Payment records</a><form th:action="@{/admin/logout}" method="post"><button class="btn btn-outline-secondary" type="submit">Sign out</button></form></div></div></nav>
<main class="container py-4 py-lg-5">
  <div class="page-heading mb-4"><div><p class="eyebrow mb-2">ADMIN WORKSPACE</p><h1>Booking requests</h1><p class="text-secondary mb-0">Review new requests, set quotes and monitor payment progress.</p></div><a class="btn btn-primary wp-primary" th:href="@{/payments}">View payments</a></div>
  <section class="panel table-panel">
    <div class="table-responsive">
      <table class="table align-middle wp-table mb-0">
        <thead><tr><th>Customer / reference</th><th>Service</th><th>Event date</th><th>Quote</th><th>Status</th><th class="text-end">Action</th></tr></thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
          <td><strong class="d-block" th:text="${booking.customerName}">Customer</strong><small class="text-secondary text-break" th:text="${booking.bookingReference}">reference</small></td>
          <td th:text="${booking.vendorName}">Vendor</td>
          <td th:text="${booking.eventDate == null ? 'Not provided' : #temporals.format(booking.eventDate, 'dd MMM yyyy')}">Date</td>
          <td th:if="${booking.quotedAmount != null}"><span th:text="${booking.currency}">LKR</span> <span th:text="${#numbers.formatDecimal(booking.quotedAmount, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
          <td th:unless="${booking.quotedAmount != null}" class="text-secondary">Not set</td>
          <td><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(booking.status.name())}" th:text="${#strings.replace(booking.status.name(), '_', ' ')}">AWAITING QUOTE</span></td>
          <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/bookings/{reference}(reference=${booking.bookingReference})}">Review</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="6" class="text-center text-secondary py-5">There are no booking requests yet.</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
