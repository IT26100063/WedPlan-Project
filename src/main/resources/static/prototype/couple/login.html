<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · WedPlan</title>
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind.config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../../css/theme.css">
</head>
<body data-root="../">
  <main class="min-h-screen grid lg:grid-cols-2">
    <!-- Image side -->
    <div class="relative hidden lg:block p-6">
      <div class="arch h-full relative">
        <img class="img-cover object-[center_40%]" src="../../img/hero-couple.jpg" alt="A bride and groom embracing on a pebble beach">
        <div class="absolute inset-0 bg-gradient-to-t from-forest-900/80 via-forest-900/10 to-transparent"></div>
        <figure class="absolute bottom-12 left-12 right-12 text-ivory">
          <blockquote class="font-display text-4xl leading-tight">"We planned the whole thing from the sofa, and still had time to enjoy being engaged."</blockquote>
          <figcaption class="mt-4 text-sm text-ivory/70">Maya &amp; Tharindu, married in Galle</figcaption>
        </figure>
      </div>
    </div>

    <!-- Form side -->
    <div class="flex flex-col px-6 sm:px-12 py-10">
      <a href="../index.html" class="inline-flex items-center gap-3 self-start">
        <img src="../../img/favicon.svg" class="w-10 h-10" alt="">
        <span class="font-display text-2xl font-semibold text-forest">WedPlan<span class="text-brass">.</span></span>
      </a>

      <div class="my-auto w-full max-w-md mx-auto py-12">
        <span class="eyebrow">Welcome back</span>
        <h1 class="font-display text-5xl font-semibold text-forest mt-4">Sign in</h1>
        <p class="text-muted mt-2">Pick up your plans where you left off.</p>

        <!-- Example of a server-side error message (show when login fails):
        <div class="alert alert-error mt-6"><i data-lucide="shield-alert"></i><span>That email and password don't match.</span></div> -->

        <!-- JSP: action="${pageContext.request.contextPath}/login" method="post" -->
        <form class="mt-8 space-y-5" data-demo="Signed in (prototype)" data-next="dashboard.html">
          <div>
            <label class="label" for="email">Email</label>
            <div class="input-icon"><i data-lucide="mail"></i><input id="email" name="email" type="email" class="input" placeholder="you@example.com" autocomplete="email" required></div>
          </div>
          <div>
            <div class="flex justify-between items-baseline"><label class="label" for="password">Password</label></div>
            <div class="input-icon relative">
              <i data-lucide="lock"></i>
              <input id="password" name="password" type="password" class="input pr-12" placeholder="••••••••" autocomplete="current-password" required>
              <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-muted hover:text-forest" data-password-toggle aria-label="Show password">
                <i data-lucide="eye" data-eye="on" class="w-4 h-4"></i><i data-lucide="eye-off" data-eye="off" class="w-4 h-4 hidden"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in <i data-lucide="arrow-right"></i></button>
        </form>

        <p class="mt-8 text-sm text-center text-muted">Just engaged? <a href="register.html" class="font-semibold text-forest hover:text-brass">Create an account</a></p>
        <div class="ornament my-8"><span></span></div>
        <a href="../admin/login.html" class="flex items-center justify-between rounded-2xl border border-line px-5 py-4 hover:border-brass transition">
          <span class="flex items-center gap-3"><span class="stat-icon"><i data-lucide="key-round"></i></span><span><span class="block font-semibold text-forest text-sm">WedPlan staff?</span><span class="block text-xs text-muted">Sign in to the staff portal</span></span></span>
          <i data-lucide="arrow-right" class="w-4 h-4 text-muted"></i>
        </a>
      </div>
    </div>
  </main>

  <script src="../../js/app.js"></script>
</body>
</html>
