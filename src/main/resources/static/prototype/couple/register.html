<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · WedPlan</title>
  <link rel="icon" href="../../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind.config.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../../css/theme.css">
</head>
<body data-root="../">
  <main class="min-h-screen grid lg:grid-cols-[1fr_1.1fr]">
    <!-- Image side -->
    <div class="relative hidden lg:block p-6">
      <div class="arch h-full relative">
        <img class="img-cover" src="../../img/florals.jpg" alt="A bridal bouquet of seasonal flowers">
        <div class="absolute inset-0 bg-gradient-to-t from-forest-900/80 via-forest-900/10 to-transparent"></div>
        <div class="absolute bottom-12 left-12 right-12 text-ivory">
          <p class="eyebrow !text-brass-light">Free to join</p>
          <ul class="mt-5 space-y-3 text-ivory/85">
            <li class="flex items-center gap-3"><i data-lucide="calendar-heart" class="w-5 h-5 text-brass-light"></i>See who's free on your date</li>
            <li class="flex items-center gap-3"><i data-lucide="wallet" class="w-5 h-5 text-brass-light"></i>Track deposits and balances</li>
            <li class="flex items-center gap-3"><i data-lucide="gem" class="w-5 h-5 text-brass-light"></i>Plus members save 10%</li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Form side -->
    <div class="flex flex-col px-6 sm:px-12 py-10">
      <a href="../index.html" class="inline-flex items-center gap-3 self-start">
        <img src="../../img/favicon.svg" class="w-10 h-10" alt="">
        <span class="font-display text-2xl font-semibold text-forest">WedPlan<span class="text-brass">.</span></span>
      </a>

      <div class="my-auto w-full max-w-lg mx-auto py-12">
        <span class="eyebrow">Congratulations!</span>
        <h1 class="font-display text-5xl font-semibold text-forest mt-4">Start planning</h1>
        <p class="text-muted mt-2">One account for both of you. It takes a minute.</p>

        <!-- JSP: action="${pageContext.request.contextPath}/register" method="post" -->
        <form class="mt-8 space-y-5" data-demo="Account created (prototype)" data-next="dashboard.html">
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="label" for="p1">Your name</label><input id="p1" name="partnerOne" class="input" placeholder="e.g. Nethmi Perera" required></div>
            <div><label class="label" for="p2">Partner's name</label><input id="p2" name="partnerTwo" class="input" placeholder="e.g. Kavin Jayawardena" required></div>
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="label" for="email">Email</label><input id="email" name="email" type="email" class="input" placeholder="you@example.com" autocomplete="email" required></div>
            <div><label class="label" for="phone">Phone</label><input id="phone" name="phone" class="input" placeholder="+94 7X XXX XXXX" required></div>
          </div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="label" for="date">Wedding date <span class="normal-case tracking-normal font-medium">(if you know it)</span></label><input id="date" name="weddingDate" type="date" class="input"></div>
            <div><label class="label" for="budget">Rough budget</label><select id="budget" name="budget" class="select"><option>Not sure yet</option><option>Under LKR 1M</option><option selected>LKR 1M – 3M</option><option>LKR 3M – 6M</option><option>LKR 6M+</option></select></div>
          </div>
          <div>
            <label class="label" for="password">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" class="input pr-12" minlength="8" autocomplete="new-password" data-strength="#strength" required>
              <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-muted hover:text-forest" data-password-toggle aria-label="Show password">
                <i data-lucide="eye" data-eye="on" class="w-4 h-4"></i><i data-lucide="eye-off" data-eye="off" class="w-4 h-4 hidden"></i>
              </button>
            </div>
            <div id="strength" class="mt-2 flex items-center gap-3"><div class="bar flex-1"><span data-bar style="width:0"></span></div><span data-label class="text-xs text-muted w-16 text-right"></span></div>
          </div>
          <div>
            <label class="label" for="confirm">Confirm password</label>
            <div><input id="confirm" type="password" class="input" autocomplete="new-password" data-match="#password" required></div>
            <p class="error-text hidden" data-match-msg>The passwords don't match.</p>
          </div>
          <label class="flex items-start gap-3 text-sm cursor-pointer">
            <input type="checkbox" class="mt-1 w-4 h-4 accent-[rgb(44,58,71)]">
            <span>Make us <strong class="text-forest">Plus members</strong> (LKR 4,900 once) for 10% off every booking.</span>
          </label>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Create our account <i data-lucide="arrow-right"></i></button>
        </form>
        <p class="mt-8 text-sm text-center text-muted">Already have an account? <a href="login.html" class="font-semibold text-forest hover:text-brass">Sign in</a></p>
      </div>
    </div>
  </main>

  <script src="../../js/app.js"></script>
</body>
</html>
